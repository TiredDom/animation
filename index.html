<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP 3.14.2, vendored like three.js so a check or render never depends on the CDN -->
    <script src="assets/vendor/gsap/gsap.min.js"></script>
    <!-- the Kip kit (synced from Animations/mascot/ by scripts/sync-kit.cjs) and a vendored three.js r169 -->
    <script src="assets/kit/mascot.js"></script>
    <script src="assets/kit/cat.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/build/three.module.js",
          "three/addons/": "./assets/vendor/three/examples/jsm/"
        }
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e1118;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      #world {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        z-index: 1;
      }
      /* the overlays (compositions/captions.html, hud.html, cards.html) sit over the 3D canvas */
      #captions,
      #hud,
      #cards {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Kip vs. Spectator Mode. The 3D world is one canvas drawn from timeline time (assets/film/world.js);
         the shots that pose it are assets/film/scene*.js. Captions, the HUD and the titles go on top. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="265.2" data-width="1920" data-height="1080">
      <canvas id="world" class="clip" data-start="0" data-duration="265.2" data-track-index="0" data-layout-ignore width="1920" height="1080"></canvas>
      <!-- captions for every spoken line, the one HUD timer, the title and end cards -->
      <!-- overlays:begin (generated by scripts/overlays.py from assets/film/timeline.js) -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="265.2" data-track-index="1" data-track-kind="captions" data-width="1920" data-height="1080"></div>
      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html" data-start="0" data-duration="265.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="cards" data-composition-id="cards" data-composition-src="compositions/cards.html" data-start="0" data-duration="265.2" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- overlays:end -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      import { createWorld } from "./assets/film/world.js";

      // Building the world (meshes, faces, shader compiles) is the heavy setup the renderer waits for.
      let world = null;
      let pending = 0;
      const ready = createWorld(document.getElementById("world"), { width: 1920, height: 1080 }).then((w) => {
        world = w;
        world.renderAt(pending);
      });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.world = ready;
      window.addEventListener("hf-seek", (e) => {
        pending = e.detail.time;
        if (world) world.renderAt(pending);
        else if (e.detail.waitUntil) e.detail.waitUntil(ready);
      });
    </script>
  </body>
</html>
