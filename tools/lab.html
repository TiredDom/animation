<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kip ep01 lab</title>
<style>
  body { margin: 0; background: #22262d; color: #cfd6e0; font: 12px/1.4 ui-monospace, Consolas, monospace; }
  #log { padding: 8px 12px; }
  img { display: block; max-width: 100%; }
</style>
</head>
<body>
<div id="log">rendering…</div>
<img id="out" alt="">
<script src="../assets/kit/mascot.js"></script>
<script src="../assets/kit/cat.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "../assets/vendor/three/build/three.module.js",
    "three/addons/": "../assets/vendor/three/examples/jsm/"
  }
}
</script>
<script type="module">
// Board lab: renders film times through the same world as the composition and saves them as one sheet in
// boards/lab/<name>.png (only through mascot/tools/serve.cjs):
//   /kip-ep01/tools/lab.html?name=scene1&t=0.9,2,6&w=960&cols=2     (no t: every shot's key time)
// res=0.5 renders the world at half size for quick drafts (the framing is the same). After the sheet is saved,
// window.__stats lists every frame's luminance mean and spread and the share of near-flat pixels, so a camera
// inside a wall (a flat grey or red frame) shows up as a number, not only by eye.
import { createWorld } from '../assets/film/world.js';

const log = document.getElementById('log');
window.addEventListener('error', (e) => { log.textContent = 'error: ' + e.message; document.title = 'error'; });
window.addEventListener('unhandledrejection', (e) => { log.textContent = 'error: ' + (e.reason && e.reason.message || e.reason); document.title = 'error'; });

const q = new URLSearchParams(location.search);
const name = q.get('name') || 'lab';
const canvas = document.createElement('canvas');
const res = Math.min(1, +q.get('res') || 1);
const world = await createWorld(canvas, { width: Math.round(1920 * res), height: Math.round(1080 * res) });
let times = q.get('t') ? q.get('t').split(',').map(Number) : world.SHOTS.filter((s) => s.built).map((s) => s.key);
if (q.get('range')) {
  // range=a,b,step: every step seconds from a to b
  const [a, b, st] = q.get('range').split(',').map(Number);
  times = [];
  for (let t = a; t < b - 1e-6; t += st) times.push(Math.round(t * 1000) / 1000);
}
if (q.get('scene')) times = world.SHOTS.filter((s) => s.scene === +q.get('scene')).map((s) => s.key);
const W = +q.get('w') || 960, H = Math.round((W * 9) / 16), cols = Math.min(+q.get('cols') || 2, times.length);
const rows = Math.ceil(times.length / cols), label = q.get('label') !== '0';
// the label sits in its own strip above each frame, so it never covers the top of the picture
const LH = label ? 22 : 0;

const sheet = document.createElement('canvas');
sheet.width = W * cols;
sheet.height = (H + LH) * rows;
const g = sheet.getContext('2d');
const t0 = performance.now();
const stats = [];
const probe = document.createElement('canvas');
probe.width = 96; probe.height = 54;
const pg = probe.getContext('2d', { willReadFrequently: true });
times.forEach((t, i) => {
  const shot = world.renderAt(t);
  const x = (i % cols) * W, y = Math.floor(i / cols) * (H + LH);
  g.drawImage(canvas, x, y + LH, W, H);
  pg.drawImage(canvas, 0, 0, 96, 54);
  const px = pg.getImageData(0, 0, 96, 54).data, lum = [];
  for (let k = 0; k < px.length; k += 4) lum.push(0.2126 * px[k] + 0.7152 * px[k + 1] + 0.0722 * px[k + 2]);
  const mean = lum.reduce((a, b) => a + b, 0) / lum.length;
  const sd = Math.sqrt(lum.reduce((a, b) => a + (b - mean) * (b - mean), 0) / lum.length);
  const med = lum.slice().sort((a, b) => a - b)[lum.length >> 1];
  const flat = lum.filter((v) => Math.abs(v - med) < 6).length / lum.length;
  stats.push({ t, shot: shot.n, mean: Math.round(mean), sd: Math.round(sd), flat: Math.round(flat * 100) / 100 });
  if (label) {
    g.fillStyle = '#111';
    g.fillRect(x, y, W, LH);
    g.fillStyle = '#fff';
    g.font = '15px ui-monospace, Consolas, monospace';
    g.fillText(String(shot.n).padStart(2, '0') + '  ' + shot.title + '   t=' + t.toFixed(2) + 's', x + 8, y + 16);
  }
});
const ms = Math.round((performance.now() - t0) / times.length);
const blob = await new Promise((r) => sheet.toBlob(r, 'image/png'));
document.getElementById('out').src = URL.createObjectURL(blob);
const saved = await fetch('/save/' + name + '.png?to=kip-ep01/boards/lab', { method: 'POST', body: blob });
log.textContent = (saved.ok ? 'saved boards/lab/' + name + '.png' : 'save failed: ' + saved.status) + ' · ' + ms + ' ms a frame';
window.__stats = stats;
document.title = saved.ok ? 'done' : 'error';
</script>
</body>
</html>
